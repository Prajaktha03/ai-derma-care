[project]
name = "ai-skin-specialist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prajaktha03", email = "prajaktha3@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116.0",
    "deepgram-sdk>=7.9.0",
    "ffmpeg>=1.4",
    "fastapi>=0.115.0",
    "gradio>=6.27.0",
    "groq>=1.5.0",
    "gtts>=2.5.4",
    "numpy>=2.4.6",
    "path>=17.1.1",
    "pillow>=12.3.0",
    "pyaudio>=0.2.14",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.18",
    "sounddevice>=0.5.5",
    "speechrecognition>=3.17.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
ai-skin-specialist = "ai_skin_specialist:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
